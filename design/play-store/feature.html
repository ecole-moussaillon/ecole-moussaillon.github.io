<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de présentation Google Play</title>
<style>
@font-face{font-family:'IM Fell English SC';src:url(../../assets/fonts/im-fell-english-sc.woff2) format('woff2')}
@font-face{font-family:'Lexend';src:url(../../assets/fonts/lexend.woff2) format('woff2')}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#0b2230}
.f{position:relative;width:1024px;height:500px;overflow:hidden}
.f img{position:absolute;left:0;top:-640px;width:1024px;height:1536px;object-fit:cover}
.f::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,20,30,0) 34%,rgba(6,20,30,.55) 62%,rgba(6,20,30,.78))}
.t{position:absolute;right:52px;top:50%;transform:translateY(-50%);z-index:1;text-align:right;color:#fff6e2}
.t small{display:block;font:600 19px/1 'Lexend',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#f3d58c;margin-bottom:14px}
.t b{display:block;font:400 76px/1 'IM Fell English SC',Georgia,serif;text-shadow:0 3px 14px rgba(0,0,0,.55)}
.t span{display:block;margin-top:16px;font:500 22px/1.3 'Lexend',sans-serif;color:#e8f1ee}
</style>
</head>
<body>
<div class="f"><img src="../../assets/bg-title.webp" alt="">
<div class="t"><small>L’école pirate</small><b>Moussaillon</b><span>Maths, français, anglais<br>du CP au CM2</span></div></div>
</body>
</html>
