<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moussaillon a déménagé</title>
<!-- À publier sur l'ancienne adresse (dépôt pierrerouby-droid/Chiffres-l-abordage, recréé après le transfert), avec 404.html identique.
     Les sauvegardes du jeu, rangées par le navigateur pour cette adresse, partent avec l'enfant vers la nouvelle adresse. -->
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B2230;color:#ffe2a6;font:600 18px system-ui,sans-serif;text-align:center;padding:24px}a{color:#fff}</style>
</head><body><p>Moussaillon a déménagé&nbsp;!<br>Direction <a id="go" href="https://ecole-moussaillon.github.io/">ecole-moussaillon.github.io</a>…</p>
<script>
(function () {
  var NEW = 'https://ecole-moussaillon.github.io/', d = {}, n = 0, page = location.pathname.replace(/^\/Chiffres-l-abordage\/?/, '');
  if (!/^(aide|support|confidentialite)\.html$/.test(page)) page = '';
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^(archipel|moussaillon)/.test(k)) { d[k] = localStorage.getItem(k); n++; } } } catch (e) {}
  var url = NEW + page + (n && !page ? '#import=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d))))) : '');
  document.getElementById('go').href = url; location.replace(url);
})();
</script></body></html>
